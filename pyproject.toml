[project]
name = "telegramq"
version = "0.1.0"
description = "Take a place in line for a class: your Telegram account posts it the instant the break starts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "telethon>=1.36",
    "aiosqlite>=0.20",
    "cryptography>=43",
    "python-dotenv>=1.0",
    "cryptg>=0.6.1",
    "pdfplumber>=0.11.10",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
